<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Качалка: прокачай тело</title>
<style>
:root{--bg:#e6e4de;--card:#f6f5f1;--ink:#1d2226;--mut:#68707a;--ac:#2a46f0;--ln:#cfccc3;--skin:#c9b8a6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#16191c;--card:#20252a;--ink:#eceae4;--mut:#98a1ab;--ac:#7d93ff;--ln:#363d44;--skin:#6e6459;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}

.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:clamp(34px,8vw,60px);line-height:1}
.sub{color:var(--mut);margin:6px 0 18px}
.hero{display:grid;grid-template-columns:200px 1fr;gap:20px;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hero svg{max-width:180px;margin:auto}}
.lv{font-size:28px}
.bars{display:grid;gap:7px;margin-top:10px}
.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.bar i{display:block;height:8px;background:var(--ln);border-radius:4px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ac)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:18px 0 12px;padding-bottom:4px}
.tabs button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.blk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:760px){.blk{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cal-h button{border:1px solid var(--ln);background:none;color:var(--ink);border-radius:8px;width:36px;height:36px;font-size:18px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid span.d{font-size:12px;color:var(--mut)}
.grid button{aspect-ratio:1;border:1px solid var(--ln);background:none;color:var(--ink);border-radius:8px;font:inherit;font-size:14px;cursor:pointer;position:relative;padding:0}
.grid button.p{background:color-mix(in srgb,var(--ac) 30%,transparent)}
.grid button.f{background:var(--ac);color:#fff}
.grid button.t{border-color:var(--ink);border-width:2px}
.grid button.s{outline:3px solid var(--ac);outline-offset:1px}
.ex{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.ex:first-of-type{border-top:0}
.ex svg{width:150px;height:102px;background:var(--bg);border-radius:10px}
.ex strong{display:block}.ex small{color:var(--mut)}
.ex input{width:28px;height:28px;accent-color:var(--ac)}
.note{color:var(--mut);font-size:14px;margin:8px 0 0}
.mus svg{width:130px;height:auto}
.mus{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;margin-top:12px}
.gn{display:flex;gap:6px;margin:10px 0}.gn button{border:1px solid var(--ln);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;cursor:pointer}.gn button[aria-pressed=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
.rst{margin-top:18px;background:none;border:1px solid var(--ln);color:var(--mut);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
</style></head><body><div class="wrap">
<h1>Прокачай тело</h1>
<p class="sub">Отмечай упражнения в календаре — аватар растёт вместе с мышцами.</p>
<section class="hero" aria-label="Аватар"><div id="av"></div><div><h2 class="lv" id="lvl"></h2><div class="gn" id="gn"></div><div class="bars" id="bars"></div></div></section>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="card mus" id="mus"></div><div class="card" id="rec" style="margin-top:12px"></div><div class="blk" style="margin-top:16px"><div class="card"><div class="cal-h"><button id="pm" aria-label="Прошлый месяц">‹</button><h3 id="mt"></h3><button id="nm" aria-label="Следующий месяц">›</button></div><div class="grid" id="cal"></div><p class="note">Нажми на день, затем отметь выполненные упражнения. Тёмный день — сделано всё.</p></div>
<div class="card"><h3 id="dt"></h3><div id="exs"></div></div></div>
<button class="rst" id="rst">Сбросить весь прогресс</button>
</div>
<script>
const P={crunch:["M34 38 L14 48 L40 48 L52 30 L58 48",30,32],legraise:["M16 48 L40 48 M40 48 L66 30",12,46],plank:["M62 34 L14 44 L8 52 M30 42 L30 52 M62 34 L62 52",68,30],pushup:["M64 28 L14 42 M64 28 L62 50 M14 42 L8 50 M40 36 L40 50",68,24],squat:["M36 16 L36 32 L52 34 L52 52 M36 18 L54 20",36,10],stand:["M40 14 L40 34 M40 34 L33 54 M40 34 L47 54 M40 20 L30 32 M40 20 L50 32",40,8],curl:["M40 14 L40 34 M40 34 L34 54 M40 34 L46 54 M40 20 L30 32 M40 20 L50 26 L50 14",40,8],pullup:["M18 6 L62 6 M40 22 L40 40 L35 56 M40 40 L45 56 M40 22 L28 6 M40 22 L52 6",40,16],dip:["M40 18 L40 36 L50 52 M40 36 L30 52 M40 22 L30 32 L22 30 M40 22 L50 32 L58 30",40,12],lunge:["M38 14 L38 32 L54 34 L56 54 M38 32 L24 42 L16 56 M38 20 L28 30 M38 20 L48 30",38,8],press:["M40 22 L40 40 L34 56 M40 40 L46 56 M40 26 L28 18 L28 4 M40 26 L52 18 L52 4",40,16],row:["M50 22 L26 32 L22 54 M26 32 L34 54 M50 24 L50 46",54,18],bridge:["M16 48 L32 36 L50 36 L54 54 M32 36 L46 52",10,46],raise:["M40 14 L40 34 M40 34 L33 54 M40 34 L47 54 M40 22 L16 24 M40 22 L64 24",40,8]};
const G=[
{id:"abs",n:"Пресс",e:[["Скручивания","3×20 · ~4 мин","crunch"],["Подъём ног лёжа","3×15 · ~4 мин","legraise"],["Планка","3×45 сек · ~4 мин","plank"],["Подъём корпуса","3×15 · ~3 мин","crunch"]]},
{id:"chest",n:"Грудь",e:[["Отжимания","4×15 · ~6 мин","pushup"],["Алмазные отжимания","3×10 · ~5 мин","pushup"],["Жим гантелей","4×12 · ~8 мин","press"],["Разводка гантелей","3×12 · ~6 мин","raise"]]},

s+='<rect x="'+(100+d*(leg/2+2)-leg/2)+'" y="165" width="'+leg+'" height="140" rx="'+(leg/2.4)+'" fill="'+col(L.legs)+'"/>'});

function head(){const tl=G.reduce((a,g)=>a+lvl(g.id),0);
const T=["Новичок","Любитель","Спортсмен","Атлет","Силач","Титан"];
document.getElementById("av").innerHTML=avatar2();
document.getElementById("lvl").textContent="Уровень "+tl+" — "+T[Math.min(5,Math.floor(tl/13))];

function tabs(){const t=document.getElementById("tabs");t.innerHTML="";G.forEach(g=>{const b=document.createElement("button");b.textContent=g.n;b.setAttribute("role","tab");b.setAttribute("aria-selected",g.id===cur);b.onclick=()=>{cur=g.id;render()};t.appendChild(b)})}
function cal(){const g=grp(cur),c=document.getElementById("cal");

const f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
for(let i=0;i<f;i++)h+="<span></span>";

function list(){const g=grp(cur),dn=done(cur,sel),p=sel.split("-");

function avatar2(){const L={};G.forEach(g=>L[g.id]=lvl(g.id));const T=Object.values(L).reduce((a,b)=>a+b,0);
const c=l=>l?"hsl("+(22-l)+" "+(60+l*3)+"% "+(76-l*3)+"%)":"#f2c9a0";

const sw=36+L.chest*1.5+L.back*1.5+L.sh*1.2,arm=16+L.bi*1.4+L.tri*.6,leg=26+L.legs*2.2,ch=14+L.chest*1.1,sr=11+L.sh*1.1;

[-1,1].forEach(d=>{const x=100+d*(sw+4);s+='<rect x="'+(x-arm/2)+'" y="108" width="'+arm+'" height="62" rx="'+(arm/2)+'" fill="'+c(Math.max(L.bi,L.tri))+'" '+o+'/><rect x="'+(x-8+d*2)+'" y="162" width="16" height="48" rx="8" fill="#f2c9a0" '+o+'/><circle cx="'+(x+d*2)+'" cy="216" r="11" fill="#f2c9a0" '+o+'/>'});
s+='<polygon points="'+(100-sw)+',100 '+(100+sw)+',100 130,215 70,215" fill="'+c(L.back)+'" '+o+'/>';

s+='<circle cx="100" cy="56" r="32" fill="#f2c9a0" '+o+'/><path d="M68 50 Q70 20 100 22 Q130 20 132 50 Q118 36 100 38 Q82 36 68 50Z" fill="#3a2a22" '+o+'/><rect x="68" y="44" width="64" height="9" rx="4" fill="#e8553d" '+o+'/>';
[88,112].forEach(x=>{s+='<ellipse cx="'+x+'" cy="66" rx="6" ry="8" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="'+(x+1)+'" cy="67" r="3.5" fill="#222"/><circle cx="'+(x-4*(x>100?-1:1)*-1)+'" cy="79" r="0"/>'});

const MU={abs:["Пресс","Прямая мышца живота, косые и поперечная мышцы"],chest:["Грудь","Большая и малая грудные мышцы"],back:["Спина","Широчайшие, трапеции, ромбовидные мышцы и разгибатели спины"],legs:["Ноги","Квадрицепсы, бицепс бедра, ягодичные мышцы и икры"],bi:["Бицепс","Двуглавая и плечевая мышцы"],tri:["Трицепс","Трёхглавая мышца на задней поверхности руки"],sh:["Плечи","Передние, средние и задние пучки дельтовидных мышц"]};

const Q={stand:[60,14,60,25,58,37,58,50,60,48,60,64,60,80],curl:[60,14,60,25,58,37,70,28,60,48,60,64,60,80],press:[60,16,60,27,70,20,66,6,60,50,60,66,60,82],raise:[60,14,60,25,74,30,90,30,60,48,60,64,60,80],squat:[52,28,54,38,66,40,80,40,46,58,70,58,62,80],lunge:[58,16,58,27,66,38,70,46,58,50,76,58,76,80],pushup:[100,44,92,48,92,62,92,78,54,62,34,70,16,78],plank:[100,48,90,52,90,74,102,74,52,64,34,70,16,76],crunch:[24,48,30,57,28,48,22,42,46,76,64,58,76,76],legraise:[12,72,24,72,38,76,50,76,52,74,70,60,86,48],pullup:[60,20,60,30,54,17,52,4,60,52,58,66,56,80],dip:[60,16,60,28,68,40,64,52,60,50,70,64,62,78],row:[84,28,76,34,64,46,72,58,48,44,52,62,52,80],bridge:[14,76,26,74,36,78,50,78,56,60,78,58,80,78]};
const F={lunge:[40,66,28,80]};
function icon(t){const q=Q[t],[h,s,e,w,hp,k,a]=[0,1,2,3,4,5,6].map(i=>[q[2*i],q[2*i+1]]);
